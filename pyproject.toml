[project]
name = "auto_dev_team"
version = "0.1.0"
description = "Local-first AI development task platform built with FastAPI, CrewAI, and Next.js"
authors = [{ name = "SvenKunkka", email = "16517426+SvenKunkka@users.noreply.github.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewai[litellm]>=1.15.7,<2.0.0",
    "fastapi>=0.128,<1.0",
    "httpx>=0.28,<1.0",
    "pypdf>=6.0,<7.0",
    "python-docx>=1.2,<2.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.40,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
]

[project.scripts]
auto_dev_team = "auto_dev_team.main:run"
run_crew = "auto_dev_team.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
